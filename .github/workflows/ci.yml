name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: revalli
          POSTGRES_PASSWORD: revalli
          POSTGRES_DB: revalli_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U revalli" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://revalli:revalli@localhost:5432/revalli_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build e teste do compose
        working-directory: deploy
        run: |
          echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)" > .env
          docker compose up -d --build --wait --wait-timeout 180
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: Logs em caso de falha
        if: failure()
        working-directory: deploy
        run: docker compose logs
