# Só os serviços de apoio para desenvolver localmente (API e frontend rodam fora do Docker).
# Uso: docker compose -f deploy/docker-compose.dev.yml up -d
name: revalli-dev

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: revalli
      POSTGRES_PASSWORD: revalli
      POSTGRES_DB: revalli
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./dev-init.sql:/docker-entrypoint-initdb.d/dev-init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata_dev:
